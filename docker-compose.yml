version: '3.8'

services:
  orchestrator:
    build: .
    container_name: config-manager-ai
    ports:
      - "8000:8000"
    environment:
      # Example: set secrets and config here
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - VENDOR_CATALOG_URL=${VENDOR_CATALOG_URL:-}
      - CONFIG_MANAGER_API_KEY=${CONFIG_MANAGER_API_KEY:-}
      - CONFIG_MANAGER_API_KEYS=${CONFIG_MANAGER_API_KEYS:-}
      - CONFIG_MANAGER_API_ROLE=${CONFIG_MANAGER_API_ROLE:-operator}
      - CONFIG_MANAGER_API_ACTOR=${CONFIG_MANAGER_API_ACTOR:-api-client}
      - CONFIG_MANAGER_DEPLOYMENT_MODE=${CONFIG_MANAGER_DEPLOYMENT_MODE:-disabled}
      - DEVICE_INVENTORY_JSON=${DEVICE_INVENTORY_JSON:-}
      - CONFIG_DB_PATH=/app/configs/network_config_manager.db
      - RAG_DB_PATH=/app/configs/vendor_knowledge.db
      - CONFIG_MANAGER_ALERT_WEBHOOK=${CONFIG_MANAGER_ALERT_WEBHOOK:-}
      - CISCO_AGENT_URL=http://agent-cisco:5003
    volumes:
      - ./configs:/app/configs
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: config-manager-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - orchestrator
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: config-manager-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  agent_cisco:
    build:
      context: .
      dockerfile: agents/agent_cisco_ssh.Dockerfile
    container_name: agent-cisco
    environment:
      - CISCO_DEVICE_HOST=cisco-simulator
      - CISCO_DEVICE_PORT=22
      - CISCO_DEVICE_USERNAME=${CISCO_SIMULATOR_USERNAME:-admin}
      - CISCO_DEVICE_PASSWORD=${CISCO_SIMULATOR_PASSWORD:-cisco}
    ports:
      - "5003:5003"
    restart: unless-stopped

  cisco_simulator:
    build:
      context: ./simulator
    container_name: cisco-simulator
    environment:
      - CISCO_SIMULATOR_USERNAME=${CISCO_SIMULATOR_USERNAME:-admin}
      - CISCO_SIMULATOR_PASSWORD=${CISCO_SIMULATOR_PASSWORD:-cisco}
    ports:
      - "2222:22"
    restart: unless-stopped

  agent_nokia:
    build:
      context: .
      dockerfile: agents/agent_nokia_ssh.Dockerfile
    container_name: agent-nokia
    ports:
      - "5001:5001"
    restart: unless-stopped

  agent_ericsson:
    build:
      context: .
      dockerfile: agents/agent_ericsson_ssh.Dockerfile
    container_name: agent-ericsson
    ports:
      - "5004:5004"
    restart: unless-stopped

  agent_openet:
    build:
      context: .
      dockerfile: agents/agent_openet_ssh.Dockerfile
    container_name: agent-openet
    ports:
      - "5005:5005"
    restart: unless-stopped

# Uncomment and configure if you use a database
# db:
#   image: postgres:15
#   environment:
#     - POSTGRES_USER=user
#     - POSTGRES_PASSWORD=pass
#     - POSTGRES_DB=dbname
#   volumes:
#     - pgdata:/var/lib/postgresql/data
#   restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
